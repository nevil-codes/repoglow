# One command to run RepoGlow with a bundled Ollama:
#   docker compose up
# The first start downloads the model (~13 GB for gpt-oss:20b).
#
# NVIDIA GPU on Linux:   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
# macOS (Metal GPU):     run Ollama natively, then
#                        docker compose -f docker-compose.yml -f docker-compose.mac.yml up app
#                        (Docker on macOS can't use the Apple GPU, so bundled Ollama would be CPU-only.)

services:
  app:
    build: .
    image: repoglow
    # Bound to localhost only: GitHub actions use your token, so the app shouldn't be reachable from the network.
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:20b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-32768}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: make sure the model is downloaded before the app starts.
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-gpt-oss:20b}"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama:

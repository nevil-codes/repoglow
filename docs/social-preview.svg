<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0716"/>
      <stop offset="1" stop-color="#05060c"/>
    </linearGradient>
    <radialGradient id="g1" cx=".18" cy=".1" r=".55">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".75"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx=".85" cy=".05" r=".5">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx=".6" cy="1.05" r=".55">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset=".55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#g1)"/>
  <rect width="1280" height="640" fill="url(#g2)"/>
  <rect width="1280" height="640" fill="url(#g3)"/>

  <g transform="translate(410 198)">
    <rect width="84" height="84" rx="22" fill="url(#logo)"/>
    <path d="M42 16l6 16.3L64.3 38 48 44l-6 16.3L36 44 19.7 38 36 32.3z" fill="#fff"/>
    <circle cx="62" cy="62" r="5" fill="#fff" opacity=".85"/>
  </g>
  <text x="518" y="270" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#fff" letter-spacing="-2">Repo<tspan fill="url(#txt)">Glow</tspan></text>

  <text x="640" y="358" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#c9cae0">Make your GitHub repo impossible to scroll past.</text>
  <text x="640" y="404" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b8da8">README · names · about · topics · badges · packages</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#c9cae0">
    <rect x="420" y="470" width="440" height="44" rx="22" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="640" y="498" text-anchor="middle">runs locally on Ollama · no API keys</text>
  </g>
</svg>
